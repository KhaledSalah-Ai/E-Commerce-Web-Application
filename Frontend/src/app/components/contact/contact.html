<div class="page-container">
  <div class="content-card">
    <h1>تواصل معنا 📞</h1>
    <p>نسعد بتلقي استفساراتكم ومقترحاتكم طوال أيام الأسبوع.</p>
    
    <form class="contact-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>الاسم:</label>
        <input type="text" placeholder="أدخل اسمك الكامل" />
      </div>

      <div class="form-group">
        <label>البريد الإلكتروني:</label>
        <input type="email" placeholder="name@example.com" />
      </div>

      <div class="form-group">
        <label>الرسالة:</label>
        <textarea rows="4" placeholder="اكتب رسالتك هنا..."></textarea>
      </div>

      <button type="submit" class="submit-btn">إرسال الرسالة</button>
    </form>

    <button class="back-btn-secondary" routerLink="/home">العودة للرئيسية</button>
  </div>
</div>
